name: Import MVP source

on:
  push:
    branches: [import-mvp]
    paths:
      - ".import/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract source
        shell: bash
        run: |
          cat .import/part*.b64 | base64 --decode > /tmp/agentic-growth-copilot.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .import -exec rm -rf {} +
          tar -xJf /tmp/agentic-growth-copilot.tar.xz -C .
          rm -rf .import

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Agentic Growth Copilot MVP"
          git push origin HEAD:import-mvp
