name: Import patched MVP source

on:
  push:
    branches: [main]
    paths:
      - "agentic-growth-copilot-patched.zip"
      - ".github/workflows/import-mvp.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project source
        shell: bash
        run: |
          rm -rf /tmp/agc-source
          mkdir -p /tmp/agc-source
          unzip -q -o agentic-growth-copilot-patched.zip -d /tmp/agc-source

          # Preserve GitHub workflow files because GITHUB_TOKEN cannot modify them.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          rsync -a --exclude='.github/workflows/' /tmp/agc-source/ ./

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Agentic Growth Copilot MVP"
          git push origin HEAD:main
