name: Import source archive

on:
  push:
    branches: [source-import]
    paths:
      - "project.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project source
        shell: bash
        run: |
          mkdir -p /tmp/agc-source
          unzip -q -o project.zip -d /tmp/agc-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/agc-source/. .

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Agentic Growth Copilot MVP"
          git push origin HEAD:source-import
