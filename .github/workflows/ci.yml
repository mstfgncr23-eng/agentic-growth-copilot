name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_MODE: mock
      PERSISTENCE_DRIVER: memory
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize Mongo acceptance test formatting
        run: pnpm exec prettier --write tests/integration/mongo-agent-store.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- tests/integration/mongo-agent-store.test.ts; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/mongo-agent-store.test.ts
          git commit -m "Format Mongo acceptance test"
          git push origin HEAD:main

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
